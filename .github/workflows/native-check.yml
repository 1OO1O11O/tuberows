name: native-check

# Compiles the TizenTube Cobalt home-screen classes against the Android 8.0 (API 26) and 14 (API 34)
# SDKs. API 26 is TizenTube's minimum, so anything newer fails the API 26 build.
on:
  push:
    branches: ['ci/native-check']

permissions:
  contents: read

jobs:
  javac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: |
          set +e +o pipefail
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          (yes | "$SDKM" "platforms;android-26" "platforms;android-34") > "$RUNNER_TEMP/sdk.txt" 2>&1
          ls "$ANDROID_HOME/platforms" > "$RUNNER_TEMP/platforms.txt"
          : > "$RUNNER_TEMP/errors.txt"
          status=0
          for api in 26 34; do
            jar="$ANDROID_HOME/platforms/android-$api/android.jar"
            if ! javac -Xlint:all,-options -Werror -source 8 -target 8 -bootclasspath "$jar" \
                -d "$RUNNER_TEMP/out$api" $(find native/src -name '*.java') > "$RUNNER_TEMP/api$api.txt" 2>&1; then
              status=1
            fi
            { echo "== API $api"; [ -f "$jar" ] || echo "missing $jar"; cat "$RUNNER_TEMP/api$api.txt"; } >> "$RUNNER_TEMP/errors.txt"
          done
          { echo "== platforms"; cat "$RUNNER_TEMP/platforms.txt"; tail -3 "$RUNNER_TEMP/sdk.txt"; } >> "$RUNNER_TEMP/errors.txt"
          msg="$(head -60 "$RUNNER_TEMP/errors.txt" | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          if [ "$status" -ne 0 ]; then echo "::error title=javac::$msg"; exit 1; fi
          echo "::notice title=javac::$msg"
